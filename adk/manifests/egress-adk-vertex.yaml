# EgressPolicy for approach B actors (adk-vertex-v1): one destination, the gateway, over plain
# HTTP. No rule for any Google API: the sandbox cannot reach the internet, and no credential
# of any kind exists on this path. The x-goog-api-key header the google-genai client sends
# (with the template's placeholder) is replaced by a JWT that ateapi mints for this actor, so
# the gateway's /genai proxy can log and, in production, verify who called the model.
rules:
- http:
    hostnames: ["gateway.workshop.svc.cluster.local"]
    effects:
      replaceHeaders:
      - header: x-goog-api-key
        actorJwt:
          audiences: ["gateway.workshop.svc.cluster.local"]
          expirationSeconds: 900
