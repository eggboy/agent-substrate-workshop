[project]
name = "workspace-agent"
version = "0.1.0"
description = "ADK workspace agent packaged as an Agent Substrate actor, with a PID 1 shim that survives SIGTERM."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "google-adk==2.14.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["agents", "shim", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.deptry.package_module_name_map]
google-adk = ["google"]
python-dotenv = ["dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
